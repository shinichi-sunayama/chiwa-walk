# Tests of the walk-log logic (apple/WalkCore) on Linux, then publish site/ (privacy policy, support) to GitHub Pages.
# Linux runners are free for public repositories and do not use macOS minutes.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  walkcore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
        working-directory: apple/WalkCore

  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: walkcore
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
