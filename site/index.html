  <h1 style="text-align:center">おはぎのおさんぽ帳</h1>
  <p class="muted" style="text-align:center">犬のトイレ記録（iPhone・Apple Watch）／おはぎきなこ工房</p>

  <section>
    <h2>腕で押すだけ</h2>
    <p>散歩中のおしっこ・うんちを、Apple Watch のボタン1つで記録。手首の振動で「記録できた」がわかります。iPhone を持たずに散歩しても大丈夫。</p>
    <h2>ログインなし・記録は自分の端末に</h2>
    <p>アカウントの登録はいりません。記録は端末とご自身の iCloud の中だけ。位置情報・広告は使いません。</p>
    <h2>いっしょに散歩する子をまとめて</h2>
    <p>何匹いっしょでも1回で記録。「前回のうんちから○時間」がすぐわかります。</p>
  </section>
