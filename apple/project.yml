# XcodeGen spec for the iPhone + Apple Watch app. The Xcode project is generated from this file
# (in the cloud build, or on a Mac with `xcodegen generate --spec apple/project.yml`), so it is not kept in git.
# Before generating, tools/make_apple_assets.sh makes apple/Generated/*.xcassets (icon, dog pictures).
name: Osanpo

options:
  bundleIdPrefix: com.ohagikinakokobo
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  WalkCore:
    path: WalkCore

targets:
  Osanpo:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
      - path: Generated/iOS.xcassets
      - path: ../assets/fonts/MPLUSRounded1c-Bold.ttf
        buildPhase: resources
    dependencies:
      - package: WalkCore
      - target: OsanpoWatch
    info:
      path: Generated/iOS-Info.plist
      properties:
        CFBundleDisplayName: おさんぽ帳
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIAppFonts: [MPLUSRounded1c-Bold.ttf]
        LSApplicationCategoryType: public.app-category.lifestyle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ohagikinakokobo.osanpo
        PRODUCT_NAME: Osanpo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}

  OsanpoWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
      - path: Generated/Watch.xcassets
      - path: ../assets/fonts/MPLUSRounded1c-Bold.ttf
        buildPhase: resources
    dependencies:
      - package: WalkCore
      - target: OsanpoComplication
    entitlements:
      path: Generated/Watch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ohagikinakokobo.osanpo]
    info:
      path: Generated/Watch-Info.plist
      properties:
        CFBundleDisplayName: おさんぽ帳
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.ohagikinakokobo.osanpo
        WKRunsIndependentlyOfCompanionApp: false
        UIAppFonts: [MPLUSRounded1c-Bold.ttf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ohagikinakokobo.osanpo.watchkitapp
        PRODUCT_NAME: OsanpoWatch
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}

  # Watch face complication (WidgetKit). Reads what the Watch app writes to the App Group.
  OsanpoComplication:
    type: app-extension
    platform: watchOS
    sources:
      - path: Complication
    dependencies:
      - package: WalkCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Generated/Complication.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ohagikinakokobo.osanpo]
    info:
      path: Generated/Complication-Info.plist
      properties:
        CFBundleDisplayName: おさんぽ帳
        CFBundleDevelopmentRegion: ja
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ohagikinakokobo.osanpo.watchkitapp.complication
        PRODUCT_NAME: OsanpoComplication
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
